[project]
name = "autocoach"
version = "0.1.0"
description = "AI-powered workout form coaching system"
authors = [
    {name = "AutoCoach Team"}
]
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Reddit scraping
    "praw>=7.7.1",
    # Video processing
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    # Data & ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # Embeddings
    "sentence-transformers>=2.3.0",
    # Vector DB
    "qdrant-client>=1.7.0",
    # LLM
    "litellm>=1.28.0",
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",  # async postgres driver
    # Data validation
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "rich>=13.7.0",  # Beautiful CLI output
    "httpx>=0.26.0",  # Modern HTTP client
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",  # parallel testing

    # Type checking
    "mypy>=1.8.0",
    "types-redis>=4.6.0",

    # Linting & Formatting
    "ruff>=0.1.14",

    # Pre-commit
    "pre-commit>=3.6.0",

    # Development tools
    "ipython>=8.20.0",
    "ipdb>=0.13.13",
]

[project.scripts]
autocoach = "autocoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocoach"]

# Ruff configuration (replaces black, isort, flake8, pylint)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/autocoach",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-vv",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (skipped by default)",
    "requires_reddit: Tests that need Reddit API credentials",
]
python_paths = ["src"]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "praw",
    "praw.*",
    "prawcore",
    "prawcore.*",
    "mediapipe.*",
    "cv2.*",
    "sentence_transformers.*",
    "qdrant_client.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
